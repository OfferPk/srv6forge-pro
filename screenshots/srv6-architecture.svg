<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchSrv6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchSrv6)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    SRv6 Architecture: Bloated Legacy SRH vs Micro-SID Zero-Trust Pipeline
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#14060c" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hazardous: Bloated SRH &amp; MTU Blackholes
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#02040a" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Uncompressed 128-bit SIDs &bull; 1500B Underlay MTU</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">No TI-LFA FRR &bull; Unassigned VRF &bull; No Boundary Filter</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0710" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CRITICAL SRv6 TRANSPORT RISKS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; 6-hop SRH adds 104B, expanding packet to 1644B (1500B transit drops packet)</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; End.DT4 decap instruction executed without assigned VRF causes silent drop</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Missing TI-LFA triggers multi-second traffic blackhole during link failure</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Missing boundary filter allows external attackers to inject arbitrary SIDs</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">PMTU DROP &bull; ROUTE LEAK &bull; PERIMETER BYPASS</text>

  <!-- Right: Hardened Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#041a24" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: SRv6Forge Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#02040a" stroke="#1e293b"/>
  <text x="560" y="170" fill="#22d3ee" font-family="monospace" font-size="11">uSID Compression &bull; H.Encaps.Red &bull; Dedicated VRF</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">9192B Jumbo MTU &bull; TI-LFA Fast Reroute &bull; S-BFD Tracking</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#082f49" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE CARRIER GUARANTEES:</text>
  <text x="560" y="275" fill="#e0f2fe" font-family="-apple-system, sans-serif" font-size="11">&bull; uSID compresses 6 micro-instructions into single carrier, cutting overhead 80%</text>
  <text x="560" y="305" fill="#e0f2fe" font-family="-apple-system, sans-serif" font-size="11">&bull; 9192B underlay MTU guarantees zero fragmentation across carrier backbone</text>
  <text x="560" y="335" fill="#e0f2fe" font-family="-apple-system, sans-serif" font-size="11">&bull; End.DT4/DT6 decapsulates directly into isolated tenant VRF FIB table</text>
  <text x="560" y="365" fill="#e0f2fe" font-family="-apple-system, sans-serif" font-size="11">&bull; TI-LFA provides deterministic sub-50ms post-convergence backup paths</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">RFC 8754 &bull; RFC 8986 &bull; CISCO IOS-XR, JUNIPER, NOKIA &amp; LINUX</text>
</svg>
